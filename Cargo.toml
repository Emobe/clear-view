[workspace]
members = ["crates/cv-core", "crates/cv-platform-win", "crates/cv-magnifier", "crates/app", "crates/cv-tts"]
# Plain `cargo build` and `cargo run` skip cv-tts (speech is parked until after v1).
# `--workspace` and `--features tts` still build it.
default-members = ["crates/cv-core", "crates/cv-platform-win", "crates/cv-magnifier", "crates/app"]
resolver = "2"

[workspace.dependencies]
parking_lot        = "0.12"
wgpu               = "30"
raw-window-handle  = "0.6"
pollster           = "0.3"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
dirs               = "5"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
egui   = "0.36.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Magnification",
] }
