[package]
name = "cv-platform-win"
version = "0.1.0"
edition = "2024"

# The Windows backend (ADR 0004). No crate but this one (and parked cv-tts) may depend on
# `windows`.
[dependencies]
cv-core           = { path = "../cv-core" }
cv-magnifier      = { path = "../cv-magnifier" }
windows           = { workspace = true }
raw-window-handle = { workspace = true }

# Dev-only (roadmap 9.1). `test = true` so the password rule's unit tests run in `cargo test`.
[[example]]
name = "focus_probe"
test = true
