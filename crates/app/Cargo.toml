[package]
name = "app"
version = "0.1.0"
edition = "2024"

# The exe the tester runs, and the name Task Manager shows.
[[bin]]
name = "clear-view"
path = "src/main.rs"

[dependencies]
cv-core = { path = "../cv-core" }
cv-tts = { path = "../cv-tts", optional = true }
eframe = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }

# The platform backend (ADR 0004). app itself has no `windows` dependency.
[target.'cfg(windows)'.dependencies]
cv-platform-win = { path = "../cv-platform-win" }

[features]
# Speech is parked until after v1. Off by default.
tts = ["dep:cv-tts"]
